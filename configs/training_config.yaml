# Training hyperparameters and configuration for DistilBERT fine-tuning
model_name: "distilbert-base-uncased"
num_labels: 2
max_length: 128
batch_size: 32
eval_batch_size: 64
learning_rate: 3.0e-5
num_epochs: 3
weight_decay: 0.01
warmup_ratio: 0.1
seed: 42
gradient_accumulation_steps: 1
max_grad_norm: 1.0

# Paths
train_data_path: "data/processed/train.csv"
val_data_path: "data/processed/val.csv"
test_data_path: "data/processed/test.csv"
output_dir: "models/pytorch"

# Optimization & Regularization
class_weights: "balanced"  # Automatically calculate class inverse frequency
early_stopping_patience: 2
save_best_model: true
metric_for_best_model: "f1"
