[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "content-moderation-engine"
version = "1.0.0"
description = "Production-grade real-time content moderation engine powered by DistilBERT, ONNX Runtime, and FastAPI"
authors = [{ name = "MLOps Team", email = "moderation@example.com" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "numpy>=1.26.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "tokenizers>=0.19.0",
    "safetensors>=0.4.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --strict-markers -p no:warnings"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E402", "B006", "B007", "B008", "B023", "E741"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "training/*", "benchmarks/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.bandit]
skips = ["B104"]


