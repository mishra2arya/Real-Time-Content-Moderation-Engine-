name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-security:
    name: Code Quality & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Lint & Security Dependencies
        run: |
          pip install --upgrade pip
          pip install ruff bandit

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Bandit Security Audit
        run: bandit -r app training -c pyproject.toml

  test-and-coverage:
    name: Automated Tests & Parity Verification
    runs-on: ubuntu-latest
    needs: lint-and-security

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate Processed Dataset
        run: python training/prepare_dataset.py

      - name: Verify or Reconstruct ONNX Model
        run: |
          if [ ! -f "models/onnx/model.onnx" ] && [ -d "models/onnx/parts" ]; then
            echo "Reconstructing ONNX model from chunks..."
            cat models/onnx/parts/model.onnx.part_* > models/onnx/model.onnx
          fi
          if [ ! -f "models/onnx/model.onnx" ]; then
            python training/export_onnx.py
          fi

      - name: Run Pytest with Coverage
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload ONNX Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnx-model
          path: models/onnx/
          retention-days: 1

  docker-build:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: test-and-coverage

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download ONNX Model Artifact
        uses: actions/download-artifact@v4
        with:
          name: onnx-model
          path: models/onnx/

      - name: Verify Model Artifact
        run: |
          ls -la models/onnx/
          test -f models/onnx/model.onnx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: content-moderation-engine:latest
